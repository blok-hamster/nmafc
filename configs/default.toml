[storage]
hot_uri = "./data/lancedb"
cold_uri = "./data/cold.db"

[decay]
lambda_core_anchor = 0.0
lambda_active_context = 0.005
lambda_ephemeral = 0.69
eta = 0.15
gamma = 0.1
w_prune = 0.1

[retrieval]
# Cosine similarity below which Hot RAM counts as holding nothing on-topic and
# the Cold ROM keyword fallback fires. Derived from the gap between answerable
# and unanswerable queries measured on two populated LoCoMo stores -- on-topic
# top-1 lands at 0.40-0.87, off-topic at 0.18-0.48 -- so 0.45 sits between the
# populations. See the comment on DecayConfig.theta for the full derivation.
# The old 0.75 predates the search metric being fixed to cosine and fires on
# ~60% of real questions, which makes the fallback the default path.
theta = 0.45
top_k = 10
fallback_keyword_limit = 20
always_search_cold = true
rrf_k = 60
rerank_top_k = 20

[time]
unit = "turns"

[embedding]
# Format: "provider/model"
# Examples: "openai/text-embedding-3-small", "ollama/nomic-embed-text"
provider_model = "openai/text-embedding-3-small"
dim = 1536

[llm]
# Format: "provider/model"
# Supported providers: openai, anthropic, groq, openrouter, together, ollama, lmstudio, vllm, azure, bedrock
# Examples:
#   "openai/gpt-4o-mini"
#   "anthropic/claude-sonnet-4-20250514"
#   "groq/llama-3.1-70b-versatile"
#   "openrouter/anthropic/claude-sonnet-4-20250514"
#   "ollama/llama3"
#   "together/meta-llama/Llama-3-70b-chat-hf"
#   "lmstudio/local-model"
#   "vllm/meta-llama/Llama-3-8b"
#   "azure/my-gpt4-deployment"          (requires AZURE_OPENAI_ENDPOINT, AZURE_OPENAI_API_KEY)
#   "bedrock/anthropic.claude-3-sonnet-20240229-v1:0"  (requires AWS credentials)
provider_model = "openai/gpt-4o-mini"
