[project]
name = "nmafc"
version = "0.1.0"
description = "Neuromorphic Memory Architecture for Conversational AI - A biologically-inspired state-based memory wrapper for LLM agents"
readme = "README.md"
authors = [
    { name = "blok-hamster", email = "josicoded@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "lancedb>=0.20,<=0.25.3",
    "pyarrow>=14.0",
    "numpy>=1.24",
    "tomli>=2.0;python_version<'3.12'",
]

[project.optional-dependencies]
llm = [
    "openai>=1.0",
    "anthropic>=0.30",
]
aws = [
    "boto3>=1.28",
]
postgres = [
    "psycopg2-binary>=2.9",
]
bench = [
    "huggingface-hub>=0.20",
    "pandas>=2.0",
    "plotly>=5.18",
    "kaleido>=0.2.1",
    "rouge-score>=0.1.2",
]
all = ["nmafc[llm,aws,postgres,bench]"]

[dependency-groups]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.8",
]

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.pyrefly]
search_path = ["."]

[tool.pyright]
extraPaths = ["."]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
